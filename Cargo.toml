[package]
name = "gerdr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
calloop-wayland-source = "0.4"
dbus = { version = "0.9.12", features = ["vendored"] }
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2.190"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "backend_drm", "backend_egl", "renderer_gl"] }
toml = "0.8"
toml_edit = "=0.22.27"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
regex = "1"
comrak = { version = "0.59.0", default-features = false }
