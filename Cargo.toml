[package]
name = "gerdr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
calloop-wayland-source = "0.4"
dbus = { version = "0.9.12", features = ["vendored"] }
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
libc = "0.2.190"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "backend_drm", "backend_egl", "renderer_gl"] }
toml = "0.8"
toml_edit = "=0.22.27"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
regex = "1"
comrak = { version = "0.59.0", default-features = false }
sha2 = "0.10.9"
zstd = { version = "0.13", default-features = false }
serde_norway = "0.9.42"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "std"] }
aes-gcm = "0.10"
hkdf = "0.12"
# shortcut: unreleased main, pinned, as 0.19 is on fontdb 0.23 and resvg 0.48 on
# 0.24 (a second font stack); go back to crates.io at cosmic-text 0.20.
cosmic-text = { git = "https://github.com/pop-os/cosmic-text", rev = "b07cb90a872cb9fec7fea1c72d734f81907fe3ad", default-features = false, features = ["std", "swash", "fontconfig"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Pictures in docs beside PNG: the decoders resvg itself uses for raster-images.
zune-jpeg = "0.5.9"
image-webp = "0.2.4"
gif = "0.14.1"

# For trying a change: a one-file rebuild takes about a quarter of what
# --release does, with paint about twice as slow. install.sh stays on release.
[profile.fast]
inherits = "release"
lto = "off"
incremental = true

[lints.clippy]
# A panic on the event loop ends the compositor and every app it hosts.
unwrap_used = "warn"
